<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATB</title>
<style>
:root{--bg:#f7f5f0;--panel:#ffffff;--text:#1f1d1a;--muted:#6b665d;--line:#e2ddd2;--accent:#6b3fa0;--accent-ink:#ffffff}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16141a;--panel:#201d26;--text:#ece8f2;--muted:#a49dae;--line:#363140;--accent:#b48ce6;--accent-ink:#16141a}
}
:root[data-theme="dark"]{--bg:#16141a;--panel:#201d26;--text:#ece8f2;--muted:#a49dae;--line:#363140;--accent:#b48ce6;--accent-ink:#16141a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:24px 16px;text-align:center}
a.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;
  font-size:17px;padding:14px 26px;border-radius:10px}
a.btn:hover{filter:brightness(1.08)}
a.btn:focus-visible{outline:3px solid var(--line);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="btn" href="darkmoon-storage-box/">Darkmoon Storage Box</a>
</main>
</body>
</html>
